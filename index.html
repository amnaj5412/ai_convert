<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Multi-Converter (Stable V2.0)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&family=Fira+Code&display=swap');
        body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
        .mono { font-family: 'Fira Code', monospace; }
        .recording-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-20">

    <header class="bg-indigo-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-microchip"></i> AI Smart Convert
            </h1>
            <div id="statusBadge" class="text-[10px] bg-green-500 px-2 py-1 rounded-full border border-white/30 uppercase tracking-widest font-bold">STABLE V2.0</div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-2xl">
        <!-- Input Section -->
        <div class="bg-white p-6 rounded-[2.5rem] shadow-xl border border-indigo-50 text-center mb-6">
            <div class="flex flex-col items-center gap-6">
                <div class="relative">
                    <div id="recordRing" class="absolute -inset-3 bg-rose-100 rounded-full hidden"></div>
                    <button id="recordBtn" class="relative w-24 h-24 bg-rose-500 hover:bg-rose-600 text-white rounded-full shadow-2xl flex flex-col items-center justify-center transition-all active:scale-95 z-10">
                        <i id="micIcon" class="fas fa-microphone text-3xl mb-1"></i>
                        <span id="timerDisplay" class="text-[10px] font-mono">00:00</span>
                    </button>
                </div>
                <div class="flex gap-3 w-full">
                    <button onclick="document.getElementById('fileInput').click()" class="flex-1 bg-indigo-50 text-indigo-700 py-4 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-indigo-100 transition-colors">
                        <i class="fas fa-camera"></i> ถ่ายรูป/อัปโหลด
                    </button>
                    <input type="file" id="fileInput" class="hidden" accept="image/*,.pdf,audio/*">
                </div>
            </div>
            <p class="mt-4 text-[10px] text-slate-400 font-semibold uppercase tracking-widest italic">รองรับรูปถ่ายตาราง, PDF และเสียงพูด</p>
        </div>

        <!-- Result Section -->
        <div class="bg-white rounded-[2.5rem] shadow-2xl border border-indigo-50 overflow-hidden mb-6">
            <div class="flex justify-between items-center p-5 border-b border-slate-50">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                    <i class="fas fa-file-invoice"></i> ผลลัพธ์ที่ถอดได้
                </h3>
                <div class="flex gap-2">
                    <button id="copyBtn" class="text-indigo-600 text-[10px] font-bold bg-indigo-50 px-3 py-1.5 rounded-full hover:bg-indigo-100 transition-colors">คัดลอก</button>
                    <button id="clearBtn" class="text-slate-400 text-[10px] font-bold bg-slate-100 px-3 py-1.5 rounded-full hover:bg-slate-200 transition-colors">ล้าง</button>
                </div>
            </div>

            <div id="loadingOverlay" class="hidden p-12 text-center">
                <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-500 border-t-transparent mb-4"></div>
                <p id="loadingText" class="text-indigo-600 text-sm font-bold animate-pulse">AI กำลังวิเคราะห์ข้อมูล...</p>
            </div>

            <textarea id="resultOutput" readonly class="w-full h-80 p-6 text-sm text-slate-700 bg-white border-none focus:ring-0 resize-none mono custom-scrollbar" placeholder="ผลลัพธ์จะปรากฏที่นี่..."></textarea>
        </div>

        <!-- Debug Log -->
        <div class="bg-slate-900 rounded-2xl p-4 shadow-inner">
            <h4 class="text-[10px] font-bold text-slate-500 uppercase mb-2 flex justify-between items-center">
                <span><i class="fas fa-terminal mr-1"></i> ระบบตรวจสอบ (Debug Log V2.0)</span>
                <span class="text-[8px] bg-slate-800 px-2 py-0.5 rounded text-slate-400">STABLE MODE</span>
            </h4>
            <div id="debugLog" class="text-[10px] text-green-400 font-mono h-40 overflow-y-auto custom-scrollbar leading-relaxed">
                > ระบบเสถียรพร้อมทำงาน... กรุณาเลือกไฟล์
            </div>
        </div>
    </main>

    <script>
        // API Key ที่ยืนยันแล้ว
        const apiKey = "AIzaSyBwybJiW4sSuU9n_3PR7eVnur_qoHJL-8Q"; 

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let timerInterval;

        function addLog(msg, type = 'info') {
            const logDiv = document.getElementById('debugLog');
            const time = new Date().toLocaleTimeString();
            let color = 'text-green-400';
            if(type === 'error') color = 'text-rose-400 font-bold';
            if(type === 'warn') color = 'text-amber-400';
            
            logDiv.innerHTML += `<div><span class="opacity-50 text-[8px]">[${time}]</span> <span class="${color}">${msg}</span></div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function processMedia(base64Data, mimeType) {
            const resultOutput = document.getElementById('resultOutput');
            const loadingText = document.getElementById('loadingText');
            
            setLoading(true);
            resultOutput.value = "";
            addLog(`รับไฟล์ใหม่: ${mimeType} (${Math.round(base64Data.length/1024)}KB)`);
            
            // ใช้โครงสร้าง Config ที่เน้น v1 เป็นหลักเพื่อความเสถียร
            const configs = [
                { version: 'v1', model: 'gemini-1.5-flash' },
                { version: 'v1beta', model: 'gemini-1.5-flash' },
                { version: 'v1', model: 'gemini-1.5-pro' }
            ];

            let success = false;

            for (const config of configs) {
                if (success) break;
                
                addLog(`กำลังเรียกใช้ AI (${config.model} - ${config.version})...`, 'warn');
                loadingText.innerText = `กำลังประมวลผลด้วย ${config.model}...`;

                const url = `https://generativelanguage.googleapis.com/${config.version}/models/${config.model}:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [{ 
                        parts: [
                            { text: "ดำเนินการสกัดข้อมูลทั้งหมดจากไฟล์ที่แนบมานี้อย่างละเอียดที่สุด หากเป็นรูปภาพที่มีตาราง ให้จัดรูปแบบเป็น Markdown Table หากเป็นเสียงให้ถอดความเป็นภาษาไทย ห้ามสรุปความ และห้ามใส่คำอธิบายเพิ่มเติมอื่นใดนอกจากเนื้อหาที่สกัดได้" },
                            { inlineData: { mimeType: mimeType, data: base64Data } }
                        ] 
                    }]
                };

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        addLog(`ล้มเหลว (${config.version}): ${data.error?.message || response.status}`, 'error');
                        continue; 
                    }

                    if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                        const text = data.candidates[0].content.parts[0].text;
                        resultOutput.value = text;
                        addLog(`สำเร็จ! ประมวลผลเสร็จสิ้นด้วย ${config.model}`, 'info');
                        success = true;
                    } else {
                        addLog(`AI ไม่พบข้อมูลในไฟล์ (${config.model})`, 'warn');
                    }

                } catch (err) {
                    addLog(`Network Error (${config.model}): ${err.message}`, 'error');
                }
            }

            if (!success) {
                addLog("ไม่สามารถเชื่อมต่อ AI ได้หลังจากลองทุกช่องทางแล้ว", 'error');
                resultOutput.value = "เกิดข้อผิดพลาด: ระบบไม่สามารถเชื่อมต่อ AI ได้ในขณะนี้\n\nสาเหตุที่เป็นไปได้:\n1. API Key อาจยังไม่เปิดใช้งาน (ใช้เวลา 5-10 นาทีหลังจากสร้างครั้งแรก)\n2. พื้นที่การเชื่อมต่ออินเทอร์เน็ตอาจถูกจำกัด\n3. ประเภทไฟล์ไม่ได้รับการสนับสนุน";
            }
            
            setLoading(false);
        }

        // --- ส่วนควบคุมอุปกรณ์ ---
        const recordBtn = document.getElementById('recordBtn');
        recordBtn.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => processMedia(reader.result.split(',')[1], "audio/webm");
                    };
                    mediaRecorder.start();
                    startTimer();
                    isRecording = true;
                    updateUI(true);
                    addLog("เริ่มบันทึกเสียงสด...");
                } catch (e) { 
                    addLog("ไม่สามารถเข้าถึงไมโครโฟน: " + e.message, 'error');
                }
            } else {
                if (mediaRecorder) mediaRecorder.stop();
                stopTimer();
                isRecording = false;
                updateUI(false);
                addLog("หยุดบันทึก กำลังวิเคราะห์เสียง...");
            }
        };

        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            addLog(`เลือกไฟล์: ${file.name}`);
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => processMedia(reader.result.split(',')[1], file.type);
        };

        document.getElementById('clearBtn').onclick = () => {
            document.getElementById('resultOutput').value = "";
            addLog("ล้างข้อมูลหน้าจอสำเร็จ");
        };

        function startTimer() {
            let s = 0;
            timerInterval = setInterval(() => {
                s++;
                const m = Math.floor(s/60).toString().padStart(2,'0');
                const sec = (s%60).toString().padStart(2,'0');
                document.getElementById('timerDisplay').innerText = `${m}:${sec}`;
            }, 1000);
        }
        function stopTimer() { clearInterval(timerInterval); document.getElementById('timerDisplay').innerText = "00:00"; }
        function setLoading(l) { 
            document.getElementById('loadingOverlay').classList.toggle('hidden', !l); 
            document.getElementById('resultOutput').classList.toggle('hidden', l);
        }
        function updateUI(r) {
            document.getElementById('recordRing').classList.toggle('hidden', !r);
            document.getElementById('micIcon').className = r ? "fas fa-stop text-3xl mb-1" : "fas fa-microphone text-3xl mb-1";
            document.getElementById('statusBadge').innerText = r ? "RECORDING" : "STABLE V2.0";
        }
        document.getElementById('copyBtn').onclick = () => {
            const out = document.getElementById('resultOutput');
            if(!out.value) return;
            out.select();
            document.execCommand('copy');
            addLog("คัดลอกข้อความลงคลิปบอร์ดแล้ว");
        };
    </script>
</body>
</html>
