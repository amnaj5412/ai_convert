<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Multi-Converter (Production)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&family=Fira+Code&display=swap');
        body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
        .mono { font-family: 'Fira Code', monospace; }
        .recording-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-microchip"></i> AI Smart Convert
            </h1>
            <div id="statusBadge" class="text-[10px] bg-white/20 px-2 py-1 rounded-full border border-white/30 uppercase tracking-widest font-bold">READY</div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-2xl">
        <div class="grid grid-cols-1 gap-4 mb-6">
            <div class="bg-white p-6 rounded-[2rem] shadow-xl border border-indigo-50 text-center">
                <div class="flex flex-col items-center gap-6">
                    <div class="relative">
                        <div id="recordRing" class="absolute -inset-3 bg-rose-100 rounded-full hidden"></div>
                        <button id="recordBtn" class="relative w-24 h-24 bg-rose-500 hover:bg-rose-600 text-white rounded-full shadow-2xl flex flex-col items-center justify-center transition-all active:scale-95 z-10">
                            <i id="micIcon" class="fas fa-microphone text-3xl mb-1"></i>
                            <span id="timerDisplay" class="text-[10px] font-mono">00:00</span>
                        </button>
                    </div>
                    <div class="flex gap-3 w-full">
                        <button onclick="document.getElementById('fileInput').click()" class="flex-1 bg-indigo-50 text-indigo-700 py-4 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-indigo-100 transition-colors">
                            <i class="fas fa-camera"></i> ถ่ายรูป/อัปโหลด
                        </button>
                        <input type="file" id="fileInput" class="hidden" accept="image/*,.pdf,audio/*">
                    </div>
                </div>
                <p id="instructionText" class="mt-4 text-[10px] text-slate-400 font-semibold uppercase">แตะเพื่อเริ่มบันทึกเสียง หรือเลือกรูปตาราง</p>
            </div>
        </div>

        <div class="bg-white rounded-[2rem] shadow-2xl border border-indigo-50 overflow-hidden">
            <div class="flex justify-between items-center p-5 border-b border-slate-50">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                    <i class="fas fa-file-invoice"></i> ผลลัพธ์ที่ถอดได้
                </h3>
                <div class="flex gap-2">
                    <button id="copyBtn" class="text-indigo-600 text-[10px] font-bold bg-indigo-50 px-3 py-1.5 rounded-full active:scale-90 transition-transform">คัดลอก</button>
                    <button id="clearBtn" class="text-slate-400 text-[10px] font-bold bg-slate-100 px-3 py-1.5 rounded-full active:scale-90 transition-transform">ล้าง</button>
                </div>
            </div>

            <div id="loadingOverlay" class="hidden p-12 text-center">
                <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-500 border-t-transparent mb-4"></div>
                <p class="text-indigo-600 text-sm font-bold animate-pulse">AI กำลังวิเคราะห์ข้อมูล...</p>
            </div>

            <div class="relative">
                <textarea id="resultOutput" readonly class="w-full h-96 p-6 text-sm text-slate-700 bg-white border-none focus:ring-0 resize-none mono" placeholder="ผลลัพธ์จะแสดงที่นี่..."></textarea>
            </div>
        </div>

        <!-- กล่องแสดง Error แบบละเอียด -->
        <div id="errorDisplay" class="hidden mt-4 p-4 bg-rose-50 text-rose-600 text-[10px] rounded-xl font-mono border border-rose-100 overflow-x-auto"></div>
    </main>

    <script>
        // --- ใส่ API Key ของคุณที่นี่ ---
        const apiKey = "AIzaSyBwybJiW4sSuU9n_3PR7eVnur_qoHJL-8Q"; 
        // ----------------------------

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let timerInterval;

        async function processMedia(base64Data, mimeType) {
            const errorDisplay = document.getElementById('errorDisplay');
            const resultOutput = document.getElementById('resultOutput');
            
            if (!apiKey || apiKey.length < 10) {
                showError("API Key ไม่ถูกต้องหรือยังไม่ได้ระบุ");
                return;
            }

            setLoading(true);
            errorDisplay.classList.add('hidden');
            resultOutput.value = "";
            
            const modelName = "gemini-1.5-flash";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ 
                    parts: [
                        { text: "สกัดข้อมูลจากไฟล์ที่แนบมา: หากเป็นรูปภาพตารางให้ถอดข้อมูลออกมาเป็น Markdown Table อย่างแม่นยำ, หากเป็นเสียงพูดให้ถอดความเป็นข้อความภาษาไทย, หากเป็นเอกสารทั่วไปให้สกัดข้อความทั้งหมด ห้ามสรุปความ" },
                        { inlineData: { mimeType: mimeType, data: base64Data } }
                    ] 
                }],
                safetySettings: [
                    { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                ]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || `HTTP Error ${response.status}`);
                }

                // ตรวจสอบว่ามีข้อมูลกลับมาหรือไม่
                if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                    resultOutput.value = data.candidates[0].content.parts[0].text;
                } else {
                    // กรณี AI ไม่สามารถสกัดข้อความได้ หรือโดนบล็อก
                    throw new Error("AI ประมวลผลสำเร็จแต่ไม่มีข้อความส่งกลับมา (อาจเกิดจากไฟล์ไม่ชัดเจนหรือระบบความปลอดภัยบล็อกเนื้อหา)");
                }

            } catch (err) {
                showError(`[พบข้อผิดพลาด] ${err.message}`);
                console.error("Full API Error:", err);
            } finally {
                setLoading(false);
            }
        }

        // --- ระบบควบคุมเสียงและไฟล์ ---
        const recordBtn = document.getElementById('recordBtn');
        recordBtn.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => processMedia(reader.result.split(',')[1], "audio/webm");
                    };
                    mediaRecorder.start();
                    startTimer();
                    isRecording = true;
                    updateUI(true);
                } catch (e) { showError("ไม่สามารถเข้าถึงไมโครโฟนได้: โปรดตรวจสอบว่าเว็บรองรับ HTTPS"); }
            } else {
                if(mediaRecorder) mediaRecorder.stop();
                stopTimer();
                isRecording = false;
                updateUI(false);
            }
        };

        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => processMedia(reader.result.split(',')[1], file.type);
        };

        document.getElementById('clearBtn').onclick = () => {
            document.getElementById('resultOutput').value = "";
            document.getElementById('errorDisplay').classList.add('hidden');
        };

        function startTimer() {
            let s = 0;
            timerInterval = setInterval(() => {
                s++;
                const m = Math.floor(s/60).toString().padStart(2,'0');
                const sec = (s%60).toString().padStart(2,'0');
                document.getElementById('timerDisplay').innerText = `${m}:${sec}`;
            }, 1000);
        }
        function stopTimer() { clearInterval(timerInterval); document.getElementById('timerDisplay').innerText = "00:00"; }
        function setLoading(l) { 
            document.getElementById('loadingOverlay').classList.toggle('hidden', !l); 
            document.getElementById('resultOutput').classList.toggle('hidden', l);
        }
        function updateUI(r) {
            document.getElementById('recordRing').classList.toggle('hidden', !r);
            document.getElementById('micIcon').className = r ? "fas fa-stop text-3xl mb-1" : "fas fa-microphone text-3xl mb-1";
            document.getElementById('statusBadge').innerText = r ? "RECORDING" : "READY";
        }
        function showError(m) {
            const errDiv = document.getElementById('errorDisplay');
            errDiv.innerText = m;
            errDiv.classList.remove('hidden');
        }
        document.getElementById('copyBtn').onclick = () => {
            const out = document.getElementById('resultOutput');
            if(!out.value) return;
            out.select();
            document.execCommand('copy');
            alert("คัดลอกลงคลิปบอร์ดแล้ว");
        };
    </script>
</body>
</html>
