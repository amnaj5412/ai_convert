<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Multi-Converter (Table Optimized)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&family=Fira+Code&display=swap');
        body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
        .mono { font-family: 'Fira Code', monospace; }
        .recording-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-microchip"></i> AI Smart Convert
            </h1>
            <div id="statusBadge" class="text-[10px] bg-white/20 px-2 py-1 rounded-full border border-white/30 uppercase tracking-widest font-bold">Ready</div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-2xl">
        
        <!-- Input Section -->
        <div class="grid grid-cols-1 gap-4 mb-6">
            <div class="bg-white p-6 rounded-[2rem] shadow-xl border border-indigo-50 text-center">
                <p class="text-xs font-bold text-slate-400 mb-4 uppercase tracking-tighter italic">รองรับรูปถ่ายตาราง, PDF และเสียงพูด</p>
                
                <div class="flex flex-col items-center gap-6">
                    <!-- Audio Record Button -->
                    <div class="relative">
                        <div id="recordRing" class="absolute -inset-3 bg-rose-100 rounded-full hidden"></div>
                        <button id="recordBtn" class="relative w-24 h-24 bg-rose-500 hover:bg-rose-600 text-white rounded-full shadow-2xl flex flex-col items-center justify-center transition-all active:scale-95 z-10">
                            <i id="micIcon" class="fas fa-microphone text-3xl mb-1"></i>
                            <span id="timerDisplay" class="text-[10px] font-mono">00:00</span>
                        </button>
                    </div>

                    <div class="flex gap-3 w-full">
                        <!-- Upload Button -->
                        <button onclick="document.getElementById('fileInput').click()" class="flex-1 bg-indigo-50 text-indigo-700 py-4 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-indigo-100 transition-colors">
                            <i class="fas fa-camera"></i> ถ่ายรูป/อัปโหลด
                        </button>
                        <input type="file" id="fileInput" class="hidden" accept="image/*,.pdf,audio/*">
                    </div>
                </div>
                
                <p id="instructionText" class="mt-4 text-[10px] text-slate-400 font-semibold uppercase">แตะเพื่อเริ่มบันทึกเสียง หรือเลือกรูปตาราง</p>
            </div>
        </div>

        <!-- Result Section -->
        <div class="bg-white rounded-[2rem] shadow-2xl border border-indigo-50 overflow-hidden">
            <div class="flex justify-between items-center p-5 border-b border-slate-50">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                    <i class="fas fa-file-invoice"></i> ผลลัพธ์ที่ถอดได้
                </h3>
                <div class="flex gap-2">
                    <button id="copyBtn" class="text-indigo-600 text-[10px] font-bold bg-indigo-50 px-3 py-1.5 rounded-full active:scale-90 transition-transform">คัดลอก</button>
                    <button id="clearBtn" class="text-slate-400 text-[10px] font-bold bg-slate-100 px-3 py-1.5 rounded-full active:scale-90 transition-transform">ล้าง</button>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingOverlay" class="hidden p-12 text-center">
                <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-500 border-t-transparent mb-4"></div>
                <p class="text-indigo-600 text-sm font-bold animate-pulse">AI กำลังวิเคราะห์ข้อมูลและตาราง...</p>
            </div>

            <!-- Info Message -->
            <div id="tableDetectedMsg" class="hidden bg-green-50 border-b border-green-100 p-3 text-[10px] text-green-700 font-medium flex items-center gap-2">
                <i class="fas fa-check-circle"></i> ตรวจพบตาราง! คุณสามารถนำไปวางใน Excel ได้ทันที
            </div>

            <div class="relative">
                <textarea id="resultOutput" readonly class="w-full h-96 p-6 text-sm text-slate-700 bg-white border-none focus:ring-0 resize-none mono custom-scrollbar" placeholder="ข้อความหรือตารางที่ถอดได้จะแสดงที่นี่..."></textarea>
            </div>
        </div>

        <!-- Custom Notification Message Box -->
        <div id="msgBox" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-6 py-3 rounded-full shadow-2xl transition-all opacity-0 translate-y-10 z-[100] pointer-events-none"></div>
    </header>

    <script>
        const apiKey = ""; // แพลตฟอร์มจะจัดการให้
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let timerSeconds = 0;
        let timerInterval;

        // Elements
        const recordBtn = document.getElementById('recordBtn');
        const recordRing = document.getElementById('recordRing');
        const micIcon = document.getElementById('micIcon');
        const timerDisplay = document.getElementById('timerDisplay');
        const fileInput = document.getElementById('fileInput');
        const resultOutput = document.getElementById('resultOutput');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const tableDetectedMsg = document.getElementById('tableDetectedMsg');
        const msgBox = document.getElementById('msgBox');
        const statusBadge = document.getElementById('statusBadge');

        // ฟังก์ชันหัวใจสำคัญ: การสั่ง AI ให้เข้าใจตาราง
        async function processMedia(base64Data, mimeType) {
            setLoading(true);
            tableDetectedMsg.classList.add('hidden');
            
            // ปรับแต่ง Prompt เพื่อให้รองรับตารางเป็นหลัก
            const systemPrompt = `คุณคือ AI ผู้เชี่ยวชาญการสกัดข้อมูล (OCR) และถอดความเสียง
            1. หากเป็นรูปภาพที่มีตาราง: ให้สกัดข้อมูลเป็นรูปแบบ Markdown Table (| หัวข้อ |) เท่านั้น รักษาสัดส่วนแถวและคอลัมน์ให้ตรง 100%
            2. หากเป็นรูปเอกสาร: ให้ถอดข้อความแบบบรรทัดต่อบรรทัด
            3. หากเป็นเสียง: ให้ถอดความเป็นภาษาไทยคำต่อคำ
            ห้ามสรุปความ ห้ามข้ามข้อมูลเด็ดขาด`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "โปรดประมวลผลไฟล์นี้ตามคำสั่งระบบ" }, { inlineData: { mimeType: mimeType, data: base64Data } }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });

                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "ไม่พบข้อความในไฟล์นี้";
                
                resultOutput.value = text;
                
                // ตรวจสอบว่าเป็นตารางหรือไม่
                if (text.includes('|') && text.includes('--')) {
                    tableDetectedMsg.classList.remove('hidden');
                }
                
                showMsg("ประมวลผลสำเร็จ!");
            } catch (err) {
                showMsg("เกิดข้อผิดพลาด: " + err.message);
                resultOutput.value = "Error: " + err.message;
            } finally {
                setLoading(false);
            }
        }

        // --- Logic การทำงานของปุ่มต่างๆ ---

        recordBtn.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => processMedia(reader.result.split(',')[1], audioBlob.type);
                    };
                    mediaRecorder.start();
                    startTimer();
                    updateRecordUI(true);
                    isRecording = true;
                } catch (err) { showMsg("ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน"); }
            } else {
                mediaRecorder.stop();
                stopTimer();
                updateRecordUI(false);
                isRecording = false;
            }
        };

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => processMedia(reader.result.split(',')[1], file.type);
        };

        document.getElementById('clearBtn').onclick = () => {
            resultOutput.value = "";
            tableDetectedMsg.classList.add('hidden');
            showMsg("ล้างค่าเรียบร้อย");
        };

        document.getElementById('copyBtn').onclick = () => {
            if (!resultOutput.value) return;
            resultOutput.select();
            document.execCommand('copy');
            showMsg("คัดลอกลง Clipboard แล้ว!");
        };

        // --- Helper Functions ---

        function setLoading(loading) {
            loadingOverlay.classList.toggle('hidden', !loading);
            resultOutput.classList.toggle('hidden', loading);
            statusBadge.innerText = loading ? "Processing..." : "Ready";
            statusBadge.className = loading ? "text-[10px] bg-amber-500 px-2 py-1 rounded-full animate-pulse font-bold" : "text-[10px] bg-white/20 px-2 py-1 rounded-full border border-white/30 font-bold";
        }

        function updateRecordUI(recording) {
            recordRing.classList.toggle('hidden', !recording);
            recordRing.classList.toggle('recording-pulse', recording);
            micIcon.className = recording ? "fas fa-stop text-3xl mb-1" : "fas fa-microphone text-3xl mb-1";
            recordBtn.className = recording ? "relative w-24 h-24 bg-slate-800 text-white rounded-full shadow-2xl flex flex-col items-center justify-center transition-all z-10" : "relative w-24 h-24 bg-rose-500 hover:bg-rose-600 text-white rounded-full shadow-2xl flex flex-col items-center justify-center transition-all active:scale-95 z-10";
            document.getElementById('instructionText').innerText = recording ? "กำลังฟังเสียงของคุณ... กดหยุดเพื่อส่ง" : "แตะเพื่อเริ่มบันทึกเสียง หรือเลือกรูปตาราง";
        }

        function startTimer() {
            timerSeconds = 0;
            timerInterval = setInterval(() => {
                timerSeconds++;
                const m = Math.floor(timerSeconds/60).toString().padStart(2,'0');
                const s = (timerSeconds%60).toString().padStart(2,'0');
                timerDisplay.innerText = `${m}:${s}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerDisplay.innerText = "00:00";
        }

        function showMsg(text) {
            msgBox.innerText = text;
            msgBox.style.opacity = "1";
            msgBox.style.transform = "translate(-50%, 0)";
            setTimeout(() => {
                msgBox.style.opacity = "0";
                msgBox.style.transform = "translate(-50%, 40px)";
            }, 3000);
        }
    </script>
</body>
</html>
